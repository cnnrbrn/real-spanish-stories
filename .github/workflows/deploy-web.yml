name: Deploy Web to Lightsail

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.DEPLOYER_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.DEPLOYER_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install lightsailctl
        run: |
          sudo curl -Lo /usr/local/bin/lightsailctl \
            https://s3.us-west-2.amazonaws.com/lightsailctl/latest/linux-amd64/lightsailctl
          sudo chmod +x /usr/local/bin/lightsailctl

      - name: Build Docker Image
        run: |
          docker build \
            -f apps/web/Dockerfile \
            --build-arg VITE_API_URL=${{ secrets.VITE_API_URL }} \
            -t web:latest .

      - name: Push Image & Get Identifier
        id: push
        run: |
          aws lightsail push-container-image \
            --service-name ${{ secrets.LIGHTSAIL_WEB_SERVICE_NAME }} \
            --label web \
            --image web:latest

          IMAGE=$(aws lightsail get-container-images \
            --service-name ${{ secrets.LIGHTSAIL_WEB_SERVICE_NAME }} \
            --query 'containerImages[0].image' \
            --output text)

          echo "image=$IMAGE" >> $GITHUB_OUTPUT

      - name: Deploy to Lightsail
        env:
          IMAGE: ${{ steps.push.outputs.image }}
          SERVICE_NAME: ${{ secrets.LIGHTSAIL_WEB_SERVICE_NAME }}
        run: |
          if [ -z "$IMAGE" ] || [ "$IMAGE" == "None" ]; then
            echo "Error: Could not retrieve the image identifier from Lightsail."
            exit 1
          fi

          CONTAINERS=$(jq -n \
            --arg image "$IMAGE" \
            '{
              "web": {
                "image": $image,
                "environment": {
                  "NODE_ENV": "production",
                  "PORT": "3000"
                },
                "ports": {
                  "3000": "HTTP"
                }
              }
            }')

          aws lightsail create-container-service-deployment \
            --service-name "$SERVICE_NAME" \
            --containers "$CONTAINERS" \
            --public-endpoint '{"containerName":"web","containerPort":3000,"healthCheck":{"path":"/","successCodes":"200-499"}}'

      - name: Invalidate CloudFront Cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
