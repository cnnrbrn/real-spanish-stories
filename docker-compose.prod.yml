services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: realspanishstories/api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env.production
    environment:
      NODE_ENV: production

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1/
    image: realspanishstories/web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
