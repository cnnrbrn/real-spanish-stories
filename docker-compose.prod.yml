services:
  api:
    image: ghcr.io/cnnrbrn/real-spanish-stories-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file: .env.production
    environment:
      NODE_ENV: production

  web:
    image: ghcr.io/cnnrbrn/real-spanish-stories-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
